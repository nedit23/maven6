
name: Selenium Java Tests & Docker Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # JOB 1: Execute Selenium TestNG Automation Tests
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java and Chrome
        run: |
          java -version
          google-chrome --version

      - name: Run Selenium tests
        run: mvn clean test

  # JOB 2: Build and Publish Docker Image
  build-and-publish-docker:
    needs: selenium-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/selenium-testng-automation:latest
            ${{ secrets.DOCKER_USERNAME }}/selenium-testng-automation:${{ github.sha }}
